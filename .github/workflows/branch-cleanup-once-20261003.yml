name: Branch cleanup once 2026-10-04

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once-20261003.yml

permissions:
  contents: write

jobs:
  delete-verified-w08-batch-k:
    runs-on: ubuntu-latest
    steps:
      - name: Delete W08 batch K refs only when heads still match
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          declare -A expected=(
            ["automation/checkout-production-scope-r16"]="108191e9cc9e12003df62d91ff3c996d29ad94c4"
            ["automation/checkout-combined-segments-r14"]="c6a7920f852ca4e59a27e000474e7f3b267ea420"
            ["automation/checkout-device-r13"]="ee45c88756c640b12fc2906515e849e6d39cf33d"
            ["automation/checkout-unattributed-r12"]="5198b8eb66f82fc9a91016d2c19b631cd9b966cd"
            ["automation/plat-pix-recovery-deeplink-r21"]="ce98439c19ca8182894a68cdc9b8c400813a5942"
            ["fix/commerce-pix-retry-service-r6"]="eee3f61152806229a1b316a66ce443b453b63742"
            ["automation/checkout-abandonment-breakdown-r11"]="e50ac2d1350f657881653a72977c73043362ad16"
            ["automation/checkout-abandonment-alias-r19"]="43b74047722febcf7b685e34e219547814327ee0"
            ["automation/remove-duplicate-payment-reconcile-r18"]="c855b0cb94aa2a9a2610a9dcb8800c56aca0af71"
            ["automation/payment-health-recovery-attribution-r16"]="a34fb140b5326b5644e4350f470b30e05ed7ad9c"
            ["automation/payment-health-diagnosis-r15"]="a9f901d47bc45e1240a314c9d30e192a3b47b6fe"
            ["automation/payment-health-incidents-r14"]="34c67742b5308a355eb86fba502ebc7ea886be74"
            ["automation/payment-health-recovery-r13"]="864d0aa0097d90d5466113a9436193598373be1f"
            ["automation/payment-health-alert-r12"]="fa8f4ca1f4058968dbb2ec49f672a1b6578d3abb"
            ["automation/payment-health-baseline-r11"]="5816f27f6479e2d2e2b7ec3d8708db12e93845d0"
            ["automation/payment-health-risk-r11"]="341700918f3bc1940e5b81cd3bd3027d0ca82711"
            ["automation/payment-reconciliation-persistence-r11"]="e73c7793472a41468eab4b15cadf40dbecdb20f3"
            ["automation/r13-reconciliation-alerts"]="9f191c1c9fe4959aeee86e6b4b9eb45698e3d0f3"
            ["automation/payment-reconciliation-telemetry-r12"]="d66553eff02faabbe59dae99fded1ae0b183d47d"
            ["automation/reconcile-payments-schedule"]="0a1f5097439894cf490c714cc9ea2f45c784cc3e"
            ["automation/r11-commerce-webhook-compat-latest"]="fe808fb6d64204729e6589a453ae732eed641f07"
            ["automation/r11-treatment-attribution"]="25f4990376f665ecc9c78a1e5ab3668fe9d493b7"
            ["automation/checkout-action-effectiveness-r11"]="9f77a0ec062a387c2ee539a871a3c2a4419699ac"
            ["automation/checkout-period-comparison-r11"]="f7cc41a0ea8ae886c55abd65233ac51cf44dcf97"
            ["automation/subscription-intent-recovery-r6"]="25c52e4968a4c4f208f06c57fabd7b6400ce7150"
            ["automation/checkout-remediation-r12"]="e814bb2ccb1e1d8be9347f1b905794c2174c7e88"
            ["automation/checkout-stage-gmv-r10"]="82a741cf377a1213306591b943c6eeb860e9c3ea"
            ["automation/checkout-journey-funnel-r10"]="c2a27fd5b9cd26f47fea7253db902274ffc65d04"
            ["automation/recovery-prominence-economics-v2"]="b1f8dbb66b333c47d91b6a299d56cbbdbc0ef012"
            ["feat/admin-password-reset"]="02f110d816a6e2c1739379b6b25173aa20270f7a"
            ["automation/profitable-pix-recovery-cta"]="b4ed7ac7191a699f83d501c42327bda1042cc6aa"
            ["automation/recovery-incrementality-control"]="450b4080c3a26d4e913f00549575b5d659fed13b"
            ["automation/cutinapp-delivery-effects-20260909"]="eba56cfa090f0390de8b30fa38e515880a474909"
            ["feat/automated-in-app-checkout-recovery"]="1d0b2acde5fb83455369b400c555a7a44e438bbd"
            ["feat/cutinapp-owner-hardening-20260907"]="6de79250e39c74ddb2de9c234dfab2ce7806a988"
            ["automation/recovery-performance-by-payment"]="7ad857381e2192c85dc2f2ab27ac5e43c815480d"
            ["automation/profitability-top-recovery-opportunities"]="5fd8446d6faab0e20929ddd56765e28e4645019f"
            ["automation/recovery-opportunity-analytics"]="e4bb02eaa43f4a1565709c6f44cd56d42bf9f0e4"
            ["automation/profitability-financial-dashboard"]="a6a311df003a04fc5a0d5ac590776f30300e0aad"
            ["fix/idempotency-upload-fingerprint"]="ad502ceb272647c9dfad15836f2e7980a3bf4f2e"
          )
          failures=0
          deleted=0
          absent=0
          changed=0
          for branch in "${!expected[@]}"; do
            echo "Checking $branch"
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$current" ]; then
              echo "Already absent: $branch"; absent=$((absent + 1)); continue
            fi
            if [ "$current" != "${expected[$branch]}" ]; then
              echo "HEAD CHANGED; refusing deletion: $branch expected=${expected[$branch]} current=$current"
              changed=$((changed + 1)); failures=$((failures + 1)); continue
            fi
            if gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
              echo "Deleted $branch"; deleted=$((deleted + 1))
            else
              echo "FAILED to delete $branch"; failures=$((failures + 1))
            fi
          done
          echo "SUMMARY deleted=$deleted already_absent=$absent changed=$changed failures=$failures"
          if [ "$failures" -ne 0 ]; then exit 1; fi
