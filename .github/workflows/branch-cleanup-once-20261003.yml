name: Branch cleanup once 2026-10-04

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once-20261003.yml

permissions:
  contents: write

jobs:
  delete-verified-w08-batch-h:
    runs-on: ubuntu-latest
    steps:
      - name: Delete W08 batch H refs only when heads still match
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          declare -A expected=(
            ["fix/artist-profile-events-v3"]="7eafe1c4e958e86746563241405e2c4df2616799"
            ["automation/workforce-invite-r5"]="4a12b8aacf916513ef6fa4db5dec42d6f75907bc"
            ["feat/advanced-social-profile"]="ef44bfe1bf8e251e1f89d62e397d5c63c0f0efeb"
            ["fix/weekly-agenda-delay-max-6-20260910"]="222863843c0cd81b98b0719b65935f30ef898319"
            ["feature/weekly-agenda-rolling-horizon-20260910"]="249b20b6189d39214eaebc20569a91594b3678c8"
            ["feat/creative-event-quality-model"]="490378c04c9876d55d341409f2280ce2d4c29c0b"
            ["feature/weekly-agenda-existing-events-20260910"]="d6f119b475d450b1b27d71bdaee984df2c5606b8"
            ["fix/scheduling-adjacent-appointments"]="e02faff943830374832ded6fec3170091996b0be"
            ["automation/sellable-inventory-r11"]="5c833fd98f8796af15346cd460e7618bcf4dcbc2"
            ["fix/scheduling-recurring-block-availability"]="c946b0aae85725da4a69f61875f19d9f4932bbce"
            ["fix/scheduling-reassignment-availability"]="06767a3b09023846519d90250db324f574b215e7"
            ["fix/booking-blocked-schedules"]="cf91535e49bf7f2638f3f3d24086ac27fbd98ce5"
            ["feat/cutinapp-email-notifications"]="c88cb6aaae9f3aeb4eff9c842a1e0b05744bb7cc"
            ["fix/cutinapp-catalog-capability"]="7b14e72c385e94bc2b9e8414903985f064f759ea"
            ["fix/admin-email-deferrals-production"]="0cfe8b27177ab3ac668652a0df1bdd116ec85abe"
            ["feat/admin-cutinapp-ticket-management"]="598c31845a2ce02d566eca3912e9c299ede05a38"
            ["fix/resilient-realtime-broadcast"]="caa07ae536be6538777404e9c046e3af703d2c12"
            ["feat/admin-establishment-event-duplicate"]="99510c783f7afe28edd5621791e9f691766aa06d"
            ["fix/cutinapp-duplicate-event-v1"]="4830933a39b05847c6b6e29f5c527272ae9feb10"
            ["feat/cutinapp-duplicate-event"]="a607c96f1d41ae8513dca48be18944a59ab4c0b6"
            ["fix/rate-limit-isolation-20260905"]="4a8a604e708560f67201f257d8569757c5287cc2"
            ["fix/event-agenda-transport-boundary"]="e89e2c81521a929c631b717f512cbe208880668d"
            ["fix/production-rating-metrics-20260905"]="09fa1978260d72b805a90db66b1c8557bf885b87"
            ["fix/acquisition-lifecycle-hardening"]="db478642ca69d96e30b0017818faa0347bda8796"
            ["fix/acquisition-capability-sync"]="3ff3cd5aac6403f62f762ca1eff3d93b4de3ecd9"
            ["chore/cognition-runtime-config"]="b52dd3cb309c69972019fb00d630b4098a8d4f16"
            ["feat/cognitive-control-center"]="8ab956e4c6a0477ccf800cba6ec2bc099b58532d"
            ["fix/leasing-production-hardening"]="e415638689da8f04ab994f8c251213bfb92328d8"
            ["fix/mission-control-resilience-contract-20260903"]="cb9b7c5dc3a2c2aa3fb808714630cf5e3bd7c4ca"
            ["feat/discovery-intelligence-rum-search-20260903"]="53a8fccd3f3a2e72f9ee5f1eb632edeee5c5b6a6"
            ["fix/branding-global-logo-propagation-20260903"]="9b1f33da28f8b7533bff6023f1ee45d6cd2ed389"
            ["feat/content-discovery-seo-20260903"]="80b124dcad5bbe508203491d3b83bcdf2a40ad55"
            ["fix/catalog-discovery-public-payload-20260903"]="772ac75b94706c9653656892ef7b0af7b16468e7"
            ["fix/admin-command-center-route-contract-v2-20260903"]="3cf1f9798d5d4eb2530cfaabfefc78fae7ca50b1"
            ["fix/generic-establishment-experience-context-v2"]="0d60af42546d83730634dbd7eec98db1e38391a3"
            ["fix/rasoio-remocao-colaborador-resposta"]="60c04523ac68347c9025d7d52b8dcd9a9ebe27cd"
            ["fix/rasoio-owner-manager-legacy-endpoint"]="9b9936b318690304f7b157d40c01b37af7e256b1"
            ["fix/rasoio-owner-como-colaborador"]="40ccbd1b55f649d863668c5ac50914f46a1dc456"
            ["fix/rasoio-disponibilidade-real"]="99475d013be05be1e2810f5f3b153e6b1250212e"
            ["refactor/platform-core-v1-final2"]="257affb34f8abb9695e0a8f03a9c048063b5bfc3"
          )
          failures=0
          deleted=0
          absent=0
          changed=0
          for branch in "${!expected[@]}"; do
            echo "Checking $branch"
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$current" ]; then
              echo "Already absent: $branch"
              absent=$((absent + 1))
              continue
            fi
            if [ "$current" != "${expected[$branch]}" ]; then
              echo "HEAD CHANGED; refusing deletion: $branch expected=${expected[$branch]} current=$current"
              changed=$((changed + 1)); failures=$((failures + 1)); continue
            fi
            if gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
              echo "Deleted $branch"; deleted=$((deleted + 1))
            else
              echo "FAILED to delete $branch"; failures=$((failures + 1))
            fi
          done
          echo "SUMMARY deleted=$deleted already_absent=$absent changed=$changed failures=$failures"
          if [ "$failures" -ne 0 ]; then exit 1; fi
