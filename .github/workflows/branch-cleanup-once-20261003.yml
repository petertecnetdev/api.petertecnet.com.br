name: Branch cleanup once 2026-10-04

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once-20261003.yml

permissions:
  contents: write

jobs:
  delete-verified-w08-batch-o:
    runs-on: ubuntu-latest
    steps:
      - name: Delete W08 batch O refs only when heads still match
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          declare -A expected=(
            ["feat/generic-resource-operations"]="a481506d31d7048a90f3acfdbfd6391a151fa47a"
            ["feat/generic-portfolio-analytics"]="12e2190c06c476bd6917db5c1a7183e464e4caf5"
            ["feat/admin-pdf-reports-20260903"]="538c02d802b69446838b5b1ca202ed09c2b797a6"
            ["refactor/commerce-domain-maturity"]="a547f2b8e5ec43b37ae91aa6f75d928e51961d21"
            ["hardening/public-file-privacy-20260902"]="2306855ffc590366eec590fe1b3a392882dbfc95"
            ["hardening/health-deploy-gate-20260902"]="e1ba91ca2aabaee664d62c9ee1d49665bf11b32d"
          )
          failures=0
          deleted=0
          absent=0
          changed=0
          for branch in "${!expected[@]}"; do
            echo "Checking $branch"
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$current" ]; then echo "Already absent: $branch"; absent=$((absent + 1)); continue; fi
            if [ "$current" != "${expected[$branch]}" ]; then
              echo "HEAD CHANGED; refusing deletion: $branch expected=${expected[$branch]} current=$current"
              changed=$((changed + 1)); failures=$((failures + 1)); continue
            fi
            if gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
              echo "Deleted $branch"; deleted=$((deleted + 1))
            else
              echo "FAILED to delete $branch"; failures=$((failures + 1))
            fi
          done
          echo "SUMMARY deleted=$deleted already_absent=$absent changed=$changed failures=$failures"
          if [ "$failures" -ne 0 ]; then exit 1; fi
