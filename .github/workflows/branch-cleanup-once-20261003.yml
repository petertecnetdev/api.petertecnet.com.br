name: Branch cleanup once 2026-10-03

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once-20261003.yml

permissions:
  contents: write

jobs:
  delete-verified-w07-main-ancestor:
    runs-on: ubuntu-latest
    steps:
      - name: Delete W07 verified main-ancestor ref only when head still matches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          declare -A expected=(
            ["feat/admin-user-360-page-20260905"]="b9e8c99a13e2ad9e2ffeab0dd5db012f294b38c7"
          )
          failures=0
          deleted=0
          absent=0
          changed=0
          for branch in "${!expected[@]}"; do
            echo "Checking $branch"
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$current" ]; then
              echo "Already absent: $branch"
              absent=$((absent + 1))
              continue
            fi
            if [ "$current" != "${expected[$branch]}" ]; then
              echo "HEAD CHANGED; refusing deletion: $branch expected=${expected[$branch]} current=$current"
              changed=$((changed + 1))
              failures=$((failures + 1))
              continue
            fi
            if gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
              echo "Deleted $branch"
              deleted=$((deleted + 1))
            else
              echo "FAILED to delete $branch"
              failures=$((failures + 1))
            fi
          done
          echo "SUMMARY deleted=$deleted already_absent=$absent changed=$changed failures=$failures"
          if [ "$failures" -ne 0 ]; then
            exit 1
          fi
