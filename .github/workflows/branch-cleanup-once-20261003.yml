name: Branch cleanup once 2026-10-04

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once-20261003.yml

permissions:
  contents: write

jobs:
  delete-verified-w08-batch-l:
    runs-on: ubuntu-latest
    steps:
      - name: Delete W08 batch L refs only when heads still match
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          declare -A expected=(
            ["automation/financial-dashboard-indexes-20260907"]="eab7fd48d17024d24784f8b0f99d706cefb1ec37"
            ["feat/admin-user-360-20260907"]="a6ba982bf413ec3f2c7169101b024294ccf73b01"
            ["feat/analytics-settlement-profitability"]="680386b982642e266bde530d297426c669822bb4"
            ["feat/cutinapp-admin-root-only"]="ea1314ae9dc2957285974518dd6b05940be3de0b"
            ["fix/backup-restore-readiness-20260906"]="96d25b1438522b84174793b4d5bb1cca4ff2afc2"
            ["feat/checkout-recovery-intent-v5-20260906"]="934af111c75925720751b0a3f887aeedd1a7bd2c"
            ["fix/commerce-checkout-idempotency"]="a7093081984553756e8cfc53de4a8ccc7d4a495f"
            ["feat/checkout-recovery-intent"]="6ad78250f25aa8c07171007731d73c2f6baff3f3"
            ["feat/commerce-recovery-revenue-attribution"]="b529cf6bc4014e497cafeb2ef176b1b058ae88f3"
            ["feat/checkout-recovery"]="13b157b19456cbc09c111d9c62642fc9ce2fa346"
            ["feat/admin-establishment-owner-transfer-preserved-20260904"]="2fb41f9061dbd96059bbd276a47938a9edfa2f24"
            ["feat/cutinapp-ticket-transfer-20260904"]="85d5772aa4836f1695230a391bfa57f41f34cb78"
          )
          failures=0
          deleted=0
          absent=0
          changed=0
          for branch in "${!expected[@]}"; do
            echo "Checking $branch"
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$current" ]; then echo "Already absent: $branch"; absent=$((absent + 1)); continue; fi
            if [ "$current" != "${expected[$branch]}" ]; then
              echo "HEAD CHANGED; refusing deletion: $branch expected=${expected[$branch]} current=$current"
              changed=$((changed + 1)); failures=$((failures + 1)); continue
            fi
            if gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
              echo "Deleted $branch"; deleted=$((deleted + 1))
            else
              echo "FAILED to delete $branch"; failures=$((failures + 1))
            fi
          done
          echo "SUMMARY deleted=$deleted already_absent=$absent changed=$changed failures=$failures"
          if [ "$failures" -ne 0 ]; then exit 1; fi
