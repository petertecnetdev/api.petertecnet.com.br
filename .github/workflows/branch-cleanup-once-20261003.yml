name: Branch cleanup once 2026-10-03

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once-20261003.yml

permissions:
  contents: write

jobs:
  delete-verified-w07-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete W07 allowlisted refs only when heads still match
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          declare -A expected=(
            ["agent/np01-t1/canonical-api-contract-guard"]="076f339f494605108ba11f4c78d2b7cfb29be9c0"
            ["agent/np01-t3/app-notification-scope"]="076f339f494605108ba11f4c78d2b7cfb29be9c0"
            ["agent/np05-t3/batch-preload-saved-searches"]="076f339f494605108ba11f4c78d2b7cfb29be9c0"
            ["agent/np09-t2/funil-analytics"]="ce7b9bab40b760a6023fd7d2a711097dc7318b09"
            ["agent/np09-t3/admin-telemetry-integrity-report"]="ce7b9bab40b760a6023fd7d2a711097dc7318b09"
            ["artist-upgrade-temp"]="1c1072e9800abc086c369814388762fe99f64676"
            ["artist-upgrade-temp2"]="1c1072e9800abc086c369814388762fe99f64676"
            ["artist-upgrade-temp3"]="1c1072e9800abc086c369814388762fe99f64676"
            ["artist-upgrade-temp4"]="1c1072e9800abc086c369814388762fe99f64676"
            ["artist-upgrade-temp5"]="1c1072e9800abc086c369814388762fe99f64676"
            ["artist-upgrade-temp6"]="1c1072e9800abc086c369814388762fe99f64676"
            ["artist-upgrade-temp7"]="1c1072e9800abc086c369814388762fe99f64676"
            ["artist-upgrade-temp8"]="1c1072e9800abc086c369814388762fe99f64676"
            ["artist-upgrade-temp9"]="1c1072e9800abc086c369814388762fe99f64676"
            ["refactor/platform-core-v1-2026-08-28"]="c7a03aa38800136f61b35f739b0ad452d9fd2db0"
            ["refactor/platform-core-v1-2026-08-28b"]="c7a03aa38800136f61b35f739b0ad452d9fd2db0"
            ["refactor/platform-core-v1-final"]="c7a03aa38800136f61b35f739b0ad452d9fd2db0"
            ["hotfix/direct-pusher-email"]="9bf5a48df83b32b331da8773b51f4b34348aac9a"
            ["owner/nexus-catalog-v2"]="215a145b84c19370b9ee2e5df83951eaeb64ca11"
          )

          failures=0
          deleted=0
          absent=0
          changed=0

          for branch in "${!expected[@]}"; do
            echo "Checking $branch"
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$current" ]; then
              echo "Already absent: $branch"
              absent=$((absent + 1))
              continue
            fi
            if [ "$current" != "${expected[$branch]}" ]; then
              echo "HEAD CHANGED; refusing deletion: $branch expected=${expected[$branch]} current=$current"
              changed=$((changed + 1))
              failures=$((failures + 1))
              continue
            fi
            if gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
              echo "Deleted $branch"
              deleted=$((deleted + 1))
            else
              echo "FAILED to delete $branch"
              failures=$((failures + 1))
            fi
          done

          echo "SUMMARY deleted=$deleted already_absent=$absent changed=$changed failures=$failures"
          if [ "$failures" -ne 0 ]; then
            exit 1
          fi
