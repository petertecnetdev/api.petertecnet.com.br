name: Database Backup Off-site

on:
  schedule:
    # 03:15 America/Sao_Paulo (UTC-3).
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Daily verified encrypted database backup
    uses: ./.github/workflows/reusable-verified-database-backup.yml
    with:
      kind: daily
      local_retention_days: 14
      artifact_retention_days: 90
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
