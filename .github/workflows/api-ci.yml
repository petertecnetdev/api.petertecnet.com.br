name: API CI

on:
  push:
    branches: [main, staging, develop, Independence, 'refactor/**', 'fix/**']
  pull_request:
    branches: [main, staging, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, gd
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish --no-check-lock

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        shell: bash
        run: |
          find app bootstrap config database routes tests -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Prepare application environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          APP_NAME=PeterTecnetAPI
          APP_ENV=testing
          APP_KEY=base64:QWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY=
          APP_DEBUG=false
          APP_URL=http://localhost
          LOG_CHANNEL=stderr
          DB_CONNECTION=sqlite
          DB_DATABASE=/tmp/api.sqlite
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          JWT_SECRET=ci-only-jwt-secret-ci-only-jwt-secret
          EOF
          touch /tmp/api.sqlite

      - name: Build Laravel caches
        shell: bash
        run: |
          set -o pipefail
          php artisan config:clear
          php artisan route:clear
          php artisan route:list 2>&1 | tee /tmp/route-list.log

      - name: Publish route bootstrap diagnostic
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/route-list.log')) return;
            const raw = fs.readFileSync('/tmp/route-list.log', 'utf8');
            if (!raw.trim()) return;
            const tail = raw.length > 12000 ? raw.slice(-12000) : raw;
            const marker = '<!-- api-ci-route-diagnostic -->';
            const body = `${marker}\n### API CI route bootstrap diagnostic\n\n\`\`\`text\n${tail}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(comment => comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Run migrations on clean database
        shell: bash
        run: |
          set -o pipefail
          php artisan migrate --force 2>&1 | tee /tmp/migrate.log

      - name: Publish migration diagnostic
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/migrate.log')) return;
            const raw = fs.readFileSync('/tmp/migrate.log', 'utf8');
            if (!raw.trim()) return;
            const tail = raw.length > 12000 ? raw.slice(-12000) : raw;
            const marker = '<!-- api-ci-migration-diagnostic -->';
            const body = `${marker}\n### API CI migration diagnostic\n\n\`\`\`text\n${tail}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(comment => comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Audit migration history
        run: php artisan platform:audit-migrations

      - name: Verify canonical API routes
        shell: bash
        run: |
          set -euo pipefail
          routes="$(php artisan route:list)"
          grep -q 'api/v1/apps/{application}' <<< "$routes"
          grep -q 'api/v1/apps/{application}/events' <<< "$routes"
          grep -q 'api/v1/apps/{application}/checkin' <<< "$routes"
          grep -q 'api/v1/apps/{application}/commerce/checkout' <<< "$routes"

      - name: Run architecture gate
        id: architecture
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/PlatformArchitectureTest.php tests/Feature/ControllerArchitectureBoundaryTest.php 2>&1 | tee /tmp/architecture.log

      - name: Publish architecture diagnostic
        if: steps.architecture.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/architecture.log')) return;
            const raw = fs.readFileSync('/tmp/architecture.log', 'utf8');
            if (!raw.trim()) return;
            const tail = raw.length > 18000 ? raw.slice(-18000) : raw;
            const marker = '<!-- api-ci-architecture-diagnostic -->';
            const body = `${marker}\n### API architecture gate diagnostic\n\n\`\`\`text\n${tail}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(comment => comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee /tmp/tests.log

      - name: Publish test diagnostic
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/tests.log')) return;
            const raw = fs.readFileSync('/tmp/tests.log', 'utf8');
            if (!raw.trim()) return;
            const tail = raw.length > 20000 ? raw.slice(-20000) : raw;
            const marker = '<!-- api-ci-test-diagnostic -->';
            const body = `${marker}\n### API test-suite diagnostic\n\n\`\`\`text\n${tail}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(comment => comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Enforce architecture gate
        if: always() && steps.architecture.outcome == 'failure'
        shell: bash
        run: |
          echo 'Architecture guardrails failed. Functional tests were still executed for complete diagnostics.'
          exit 1

  mysql-isolado:
    name: MySQL 8 efêmero — migrações e regressões P0
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cutinapp_ci_test
          MYSQL_USER: ci_independence
          MYSQL_PASSWORD: ci_mysql_ephemeral
          MYSQL_ROOT_PASSWORD: ci_root_ephemeral
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=ci_independence --password=ci_mysql_ephemeral"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:QWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY=
      APP_URL: http://localhost
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: cutinapp_ci_test
      DB_USERNAME: ci_independence
      DB_PASSWORD: ci_mysql_ephemeral
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      JWT_SECRET: ci-only-jwt-secret-ci-only-jwt-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP com PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, gd
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar Laravel exclusivamente para MySQL efêmero
        shell: bash
        run: |
          set -euo pipefail
          cat > .env <<'EOF'
          APP_NAME=PeterTecnetAPI
          APP_ENV=testing
          APP_KEY=base64:QWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY=
          APP_DEBUG=false
          APP_URL=http://localhost
          LOG_CHANNEL=stderr
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=cutinapp_ci_test
          DB_USERNAME=ci_independence
          DB_PASSWORD=ci_mysql_ephemeral
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          JWT_SECRET=ci-only-jwt-secret-ci-only-jwt-secret
          EOF
          php artisan config:clear
          php artisan route:clear

      - name: Permitir criação de triggers somente no MySQL descartável
        shell: bash
        run: |
          set -euo pipefail
          # A migration de compatibilidade cria triggers. Com binlog ativo, MySQL 8
          # exige esta configuração do servidor; nunca aplicar em banco externo.
          php -r '$db = new PDO("mysql:host=127.0.0.1;port=3306;dbname=cutinapp_ci_test", "root", "ci_root_ephemeral", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); $db->exec("SET GLOBAL log_bin_trust_function_creators = 1"); if ((int) $db->query("SELECT @@GLOBAL.log_bin_trust_function_creators")->fetchColumn() !== 1) { exit(1); } echo "Trigger DDL habilitado apenas no MySQL efêmero.\\n";'

      - name: Migrar, reverter última migration e reaplicar no MySQL de teste
        shell: bash
        run: |
          set -euo pipefail
          php artisan migrate --force
          php artisan migrate:status
          php artisan migrate:rollback --step=1 --force 2>&1 | tee /tmp/mysql-rollback.log
          grep -Eq 'Rolling back|Rolled back' /tmp/mysql-rollback.log
          php artisan migrate --force
          php artisan migrate:status
          php artisan platform:audit-migrations

      - name: Comprovar conexão MySQL dentro do PHPUnit e testar regressões financeiras
        shell: bash
        run: |
          set -euo pipefail
          sed -e 's/name="DB_CONNECTION" value="sqlite"/name="DB_CONNECTION" value="mysql"/' \
              -e 's/name="DB_DATABASE" value=":memory:"/name="DB_DATABASE" value="cutinapp_ci_test"/' \
              phpunit.xml > phpunit.mysql-ci.xml
          grep -q 'name="DB_CONNECTION" value="mysql"' phpunit.mysql-ci.xml
          grep -q 'name="DB_DATABASE" value="cutinapp_ci_test"' phpunit.mysql-ci.xml
          cat > tests/Feature/CiMysqlDriverGateTest.php <<'PHP'
          <?php

          namespace Tests\Feature;

          use Illuminate\Support\Facades\DB;
          use Tests\TestCase;

          final class CiMysqlDriverGateTest extends TestCase
          {
              public function test_phpunit_uses_real_ephemeral_mysql_connection(): void
              {
                  $this->assertSame('mysql', config('database.default'));
                  $this->assertSame('mysql', DB::connection()->getDriverName());
                  $this->assertSame('cutinapp_ci_test', DB::selectOne('SELECT DATABASE() AS database_name')->database_name);
              }
          }
          PHP
          ./vendor/bin/phpunit --configuration phpunit.mysql-ci.xml \
            tests/Feature/CiMysqlDriverGateTest.php \
            tests/Feature/AsaasCommerceWebhookReplayP0Test.php \
            tests/Feature/CutinappCommerceProductionSafetyTest.php \
            tests/Feature/AsaasCommerceWebhookMysqlConcurrencyP0Test.php
