name: Dependency Security

on:
  push:
    branches: [main]
    paths:
      - composer.json
      - composer.lock
      - package.json
      - package-lock.json
      - .github/workflows/dependency-security.yml
  pull_request:
    branches: [main, staging, develop]
    paths:
      - composer.json
      - composer.lock
      - package.json
      - package-lock.json
      - .github/workflows/dependency-security.yml
  schedule:
    - cron: '37 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-audit:
    name: Composer vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Validate locked dependencies
        run: |
          set -euo pipefail
          composer validate --no-check-publish --no-check-lock
          composer audit --locked --no-dev

  npm-audit:
    name: NPM production vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Audit production dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
