name: Deploy VPS

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-staging
  cancel-in-progress: true

jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - run: echo "VPS deployment temporarily held during production service recovery."
