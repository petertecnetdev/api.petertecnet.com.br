name: Deploy VPS

# Production deploys are released only after the central API CI completes successfully.
on:
  workflow_run:
    workflows: ['API CI']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'push'
        )
      }}
    uses: petertecnetdev/petertecnet.com.br/.github/workflows/reusable-vps-deploy.yml@main
    with:
      deploy_path: /var/www/api.petertecnet.com.br
      deploy_type: laravel
      deploy_branch: main
      health_url: https://api.petertecnet.com.br/
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
