name: Deploy VPS

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Central deploy: SSH retries, serialized VPS builds and superseded-run cancellation.
    uses: petertecnetdev/petertecnet.com.br/.github/workflows/reusable-vps-deploy.yml@main
    with:
      deploy_path: /var/www/api.petertecnet.com.br
      deploy_type: laravel
      deploy_branch: staging
      health_url: 'https://api.petertecnet.com.br/health'
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
