name: Audit Luxury Events

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-luxury-events.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find Luxury-related events safely
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          port="${VPS_PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "$port" "$VPS_USER@$VPS_HOST" 'cd /var/www/api.petertecnet.com.br && php' <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          $rows=App\Models\Event::query()
            ->where(function($q){
              $q->whereRaw('LOWER(COALESCE(venue, "")) LIKE ?', ['%luxury%'])
                ->orWhereRaw('LOWER(COALESCE(title, "")) LIKE ?', ['%luxury%'])
                ->orWhereRaw('LOWER(COALESCE(description, "")) LIKE ?', ['%luxury%']);
            })
            ->orderBy('start_date')
            ->limit(100)
            ->get(['id','app_id','production_id','title','slug','venue','city','uf','start_date','end_date','is_published','is_cancelled','created_at']);

          $allRecent=App\Models\Event::query()
            ->where('app_id',6)
            ->whereBetween('start_date',['2026-09-20 00:00:00','2026-10-15 23:59:59'])
            ->orderBy('start_date')
            ->limit(200)
            ->get(['id','production_id','title','venue','start_date','end_date','is_published','is_cancelled']);

          echo 'LUXURY_EVENT_SEARCH_JSON=', json_encode([
            'matched'=>$rows->map(fn($e)=>[
              'id'=>$e->id,'app_id'=>$e->app_id,'production_id'=>$e->production_id,'title'=>$e->title,
              'venue'=>$e->venue,'city'=>$e->city,'uf'=>$e->uf,
              'start_date'=>(string)$e->start_date,'end_date'=>(string)$e->end_date,
              'weekday'=>$e->start_date?Illuminate\Support\Carbon::parse($e->start_date)->dayOfWeekIso:null,
              'published'=>(bool)$e->is_published,'cancelled'=>(bool)$e->is_cancelled,
            ])->values(),
            'recent_app6'=>$allRecent->map(fn($e)=>[
              'id'=>$e->id,'production_id'=>$e->production_id,'title'=>$e->title,'venue'=>$e->venue,
              'start_date'=>(string)$e->start_date,'end_date'=>(string)$e->end_date,
              'weekday'=>$e->start_date?Illuminate\Support\Carbon::parse($e->start_date)->dayOfWeekIso:null,
              'published'=>(bool)$e->is_published,'cancelled'=>(bool)$e->is_cancelled,
            ])->values(),
          ],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES),PHP_EOL;
          PHP
