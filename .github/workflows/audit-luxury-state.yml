name: Audit Luxury State

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-luxury-state.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Audit Luxury and Bruna read-only
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          port="${VPS_PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "$port" "$VPS_USER@$VPS_HOST" 'cd /var/www/api.petertecnet.com.br && php' <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          $productions = App\Models\Production::query()
              ->where(function ($q) {
                  $q->whereRaw('LOWER(name) LIKE ?', ['%luxury%'])
                    ->orWhereRaw('LOWER(fantasy) LIKE ?', ['%luxury%']);
              })
              ->get();

          $payload = [];
          foreach ($productions as $production) {
              $owner = App\Models\User::query()->find($production->user_id);
              $events = App\Models\Event::query()
                  ->where('production_id', $production->id)
                  ->orderBy('start_date')
                  ->get(['id','title','start_date','end_date','is_published','is_cancelled']);
              $beneficiary = $owner ? Illuminate\Support\Facades\DB::table('financial_beneficiaries')->where('user_id',$owner->id)->first() : null;
              $verification = $beneficiary ? Illuminate\Support\Facades\DB::table('identity_verifications')->where('beneficiary_id',$beneficiary->id)->latest('id')->first() : null;
              $destination = Illuminate\Support\Facades\DB::table('financial_payout_destinations')->where('source_type','production')->where('source_id',$production->id)->first();
              $agreement = Illuminate\Support\Facades\DB::table('contract_acceptances')->where('app_id',$production->app_id)->where('production_id',$production->id)->latest('id')->first();
              $onboarding = Illuminate\Support\Facades\DB::table('organization_onboardings')->where('app_id',$production->app_id)->where('establishment_id',$production->id)->first();

              $payload[] = [
                  'production_id' => $production->id,
                  'name' => $production->fantasy ?: $production->name,
                  'app_id' => $production->app_id,
                  'owner_id' => $owner?->id,
                  'owner_first_name' => $owner?->first_name,
                  'owner_last_name_initial' => $owner?->last_name ? mb_substr($owner->last_name,0,1).'.' : null,
                  'owner_has_email' => (bool) $owner?->email,
                  'owner_email_domain' => $owner?->email && str_contains($owner->email,'@') ? explode('@',$owner->email,2)[1] : null,
                  'events' => $events->map(function($event) {
                      $start = $event->start_date ? Illuminate\Support\Carbon::parse($event->start_date) : null;
                      return [
                          'id' => $event->id,
                          'title' => $event->title,
                          'start_date' => $start?->format('Y-m-d H:i:s'),
                          'weekday_iso' => $start?->dayOfWeekIso,
                          'published' => (bool) $event->is_published,
                          'cancelled' => (bool) $event->is_cancelled,
                      ];
                  })->values()->all(),
                  'agreement_signed' => (bool) $agreement,
                  'identity_profile' => (bool) $beneficiary,
                  'identity_status' => $beneficiary?->status,
                  'document_uploaded' => (bool) ($verification?->document_front_path),
                  'selfie_document_uploaded' => property_exists($verification ?? new stdClass(), 'selfie_document_path') && (bool) ($verification?->selfie_document_path),
                  'liveness_status' => $verification?->liveness_status,
                  'face_match_status' => $verification?->face_match_status,
                  'pix_destination' => (bool) $destination,
                  'pix_status' => $destination?->status,
                  'onboarding_exists' => (bool) $onboarding,
                  'handoff_sent' => (bool) ($onboarding?->handoff_sent_at),
              ];
          }

          echo 'LUXURY_AUDIT_JSON=', json_encode(['matches'=>count($payload),'productions'=>$payload], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES), PHP_EOL;
          PHP
