name: Reconcile API VPS File Mode

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-api-vps-mode.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Normalize routes console mode only when contents match main
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          port="${VPS_PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "$port" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/api.petertecnet.com.br
          git -c gc.auto=0 fetch --prune origin main >/dev/null
          local_hash="$(git hash-object routes/console.php)"
          remote_hash="$(git rev-parse origin/main:routes/console.php)"
          if [[ "$local_hash" != "$remote_hash" ]]; then
            echo "Refusing mode normalization: routes/console.php contents differ from origin/main." >&2
            exit 27
          fi
          sudo chmod 0644 routes/console.php
          if [[ -n "$(git status --porcelain=v1 -- routes/console.php)" ]]; then
            echo "routes/console.php is still modified after chmod; refusing further changes." >&2
            git status --porcelain=v1 -- routes/console.php >&2
            exit 28
          fi
          echo "routes/console.php mode normalized safely."
          REMOTE
